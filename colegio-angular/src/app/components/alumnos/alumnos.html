<div class="alumnos-container">

  <div class="encabezado">

    <div>
      <h1>Gestión de Alumnos</h1>
      <p>Listado de alumnos registrados</p>
    </div>

    <button
      type="button"
      class="btn-nuevo"
      (click)="abrirFormularioAlumno()">

      + Nuevo alumno

    </button>

  </div>


  <div class="tabla-container">

    <table>

      <thead>

        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>DNI</th>
          <th>Email</th>
      
        </tr>

      </thead>

      <tbody>

        @for (alumno of alumnos; track alumno.id) {

          <tr>

            <td>{{ alumno.id }}</td>

            <td>{{ alumno.nombre }}</td>

            <td>{{ alumno.apellido }}</td>

            <td>{{ alumno.dni }}</td>

            <td>{{ alumno.email }}</td>



          </tr>

        }

        @empty {

          <tr>

            <td colspan="6">
              No hay alumnos registrados.
            </td>

          </tr>

        }

      </tbody>

    </table>

  </div>

</div>
