services:

  registry:
    build:
      context: ./registry
      dockerfile: Dockerfile
    container_name: registry
    ports:
      - "8761:8761"
    networks:
      - escuela-network

  configserver:
    build:
      context: ./configServer
      dockerfile: Dockerfile
    container_name: configserver
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - registry
    networks:
      - escuela-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - escuela-network

  auth:
    build:
      context: ./Auth
      dockerfile: Dockerfile
    container_name: auth
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - registry
    networks:
      - escuela-network

  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - registry
      - configserver
      - auth
    networks:
      - escuela-network

  alumno:
    build:
      context: ./Alumno
      dockerfile: Dockerfile
    container_name: alumno
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - registry
      - configserver
      - rabbitmq
    networks:
      - escuela-network

  cursos:
    build:
      context: ./Cursos
      dockerfile: Dockerfile
    container_name: cursos
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - registry
      - configserver
      - rabbitmq
    networks:
      - escuela-network

  administracion:
    build:
      context: ./Administracion
      dockerfile: Dockerfile
    container_name: administracion
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - registry
      - configserver
    networks:
      - escuela-network

  adminserver:
    build:
      context: ./AdminServer
      dockerfile: Dockerfile
    container_name: adminserver
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - registry
      - configserver
    networks:
      - escuela-network

networks:
  escuela-network:
    driver: bridge